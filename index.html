<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>역사탐구반 · 한국사 주요 인물 100인 퀴즈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --hanji-bg: #f3ece0;
      --hanji-card: #faf6ee;
      --hanji-dark: #e6dcc8;
      --wood-dark: #2c1e16;
      --wood-mid: #4a3525;
      --wood-light: #7c5c43;
      --giwa-dark: #1f2428;
      --giwa-mid: #323940;
      --seal-red: #a32929;
      --seal-red-hover: #821d1d;
      --brass-gold: #b58938;
      --brass-light: #e5c47b;
      --ink-black: #221b16;
      --ink-gray: #5c5046;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Gowun Batang', 'Noto Serif KR', serif;
      background-color: var(--hanji-bg);
      /* 한지 섬유질 & 은은한 전통 창살 격자 패턴 */
      background-image: 
        linear-gradient(rgba(74, 53, 37, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(74, 53, 37, 0.04) 1px, transparent 1px);
      background-size: 48px 48px;
      color: var(--ink-black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      user-select: none;
    }

    /* ==================== 한옥 기와 처마 상단 헤더 ==================== */
    header {
      background: linear-gradient(180deg, var(--giwa-dark) 0%, var(--giwa-mid) 82%, var(--wood-dark) 100%);
      color: #f5efe6;
      padding: 14px 32px 18px;
      border-bottom: 5px solid var(--wood-mid);
      box-shadow: 0 6px 20px rgba(34, 27, 22, 0.25);
      position: relative;
      z-index: 10;
    }

    /* 기와 물결 하단 장식 */
    header::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -11px;
      height: 8px;
      background-image: radial-gradient(circle at 12px 0, var(--wood-dark) 10px, transparent 11px);
      background-size: 24px 10px;
      pointer-events: none;
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* 붉은 인장(낙관) 스타일 로고 */
    .brand-seal {
      width: 44px;
      height: 44px;
      background: var(--seal-red);
      border: 2px solid #e8b4b4;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif KR', serif;
      font-weight: 900;
      font-size: 20px;
      color: #faf6ee;
      box-shadow: inset 0 0 6px rgba(0,0,0,0.35), 0 2px 6px rgba(0,0,0,0.3);
      letter-spacing: -1px;
    }

    .brand-title h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--brass-light);
      letter-spacing: 0.03em;
    }

    .brand-title p {
      font-size: 0.85rem;
      color: #d6ccc2;
      margin-top: 2px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .total-badge {
      background: rgba(44, 30, 22, 0.75);
      border: 1.5px solid var(--brass-gold);
      padding: 6px 16px;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--brass-light);
    }

    .btn-reset {
      background: transparent;
      color: #e6dcc8;
      border: 1px solid rgba(230, 220, 200, 0.4);
      padding: 6px 14px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: var(--seal-red);
      border-color: #f5c2c2;
      color: #fff;
    }

    /* ==================== 시대별 문패(현판) 현황 바 ==================== */
    .era-status-bar {
      background: var(--hanji-dark);
      border-bottom: 2px solid #cbbba0;
      padding: 14px 20px 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .era-pill {
      background: var(--hanji-card);
      border: 1.5px solid var(--wood-light);
      border-radius: 3px;
      padding: 5px 12px;
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--wood-dark);
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 2px 4px rgba(44, 30, 22, 0.08);
      transition: all 0.25s;
    }

    .era-pill.empty {
      opacity: 0.45;
      text-decoration: line-through;
      background: #dfd6c5;
      border-color: #a89984;
    }

    .era-pill .count {
      background: var(--wood-mid);
      color: var(--brass-light);
      font-size: 0.76rem;
      padding: 1px 7px;
      border-radius: 2px;
      font-weight: 700;
    }

    .era-pill.empty .count {
      background: #7c6f64;
      color: #e6dcc8;
    }

    /* ==================== 메인 한옥 대청마루 무대 ==================== */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      position: relative;
    }

    .screen {
      width: 100%;
      max-width: 1060px;
      display: none;
      animation: fadeIn 0.35s ease-out;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 한옥 창호(문살) 테두리 액자 */
    .hanok-frame {
      width: 100%;
      background: var(--hanji-card);
      border: 8px solid var(--wood-dark);
      outline: 2px solid var(--brass-gold);
      outline-offset: -12px;
      border-radius: 6px;
      padding: 40px 32px 44px;
      box-shadow: 
        0 18px 40px rgba(34, 27, 22, 0.18),
        inset 0 0 40px rgba(181, 137, 56, 0.08);
      text-align: center;
      position: relative;
    }

    /* 네 귀퉁이 전통 놋쇠 장석 느낌 */
    .corner-ornament {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 3px solid var(--brass-gold);
      pointer-events: none;
    }
    .corner-tl { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .corner-tr { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .corner-bl { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .corner-br { bottom: 8px; right: 8px; border-left: none; border-top: none; }

    /* 나무 현판(扁額) 스타일 타이틀 */
    .hyonpan-title {
      display: inline-block;
      background: var(--wood-dark);
      color: var(--brass-light);
      border: 3px solid var(--brass-gold);
      padding: 10px 34px;
      border-radius: 4px;
      font-family: 'Noto Serif KR', serif;
      font-size: 1.95rem;
      font-weight: 900;
      letter-spacing: 0.06em;
      box-shadow: 0 6px 16px rgba(34, 27, 22, 0.25);
      margin-bottom: 10px;
    }

    .stage-subtitle {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--wood-light);
      margin-bottom: 28px;
    }

    /* ==================== 1. 한옥 창호 슬롯 돌림판 ==================== */
    .slot-machine-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .pointer-arrow {
      font-size: 2.5rem;
      color: var(--seal-red);
      filter: drop-shadow(0 2px 4px rgba(163, 41, 41, 0.35));
      animation: pulseArrow 1.4s infinite ease-in-out;
      flex-shrink: 0;
    }

    .pointer-arrow.right { animation-delay: 0.2s; }

    @keyframes pulseArrow {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.16); }
    }

    .slot-window {
      position: relative;
      width: 100%;
      height: 270px; /* 90px * 3칸 */
      background: #1c1510;
      border: 7px solid var(--wood-mid);
      border-radius: 6px;
      overflow: hidden;
      box-shadow:
        inset 0 20px 30px rgba(0, 0, 0, 0.8),
        inset 0 -20px 30px rgba(0, 0, 0, 0.8),
        0 10px 24px rgba(34, 27, 22, 0.25);
    }

    /* 중앙 놋쇠 금테 당첨선 */
    .slot-center-line {
      position: absolute;
      top: 90px;
      left: 0;
      right: 0;
      height: 90px;
      border-top: 3px solid var(--brass-light);
      border-bottom: 3px solid var(--brass-light);
      background: linear-gradient(90deg, rgba(181, 137, 56, 0.16), rgba(250, 246, 238, 0.22), rgba(181, 137, 56, 0.16));
      pointer-events: none;
      z-index: 3;
      box-shadow: 0 0 24px rgba(229, 196, 123, 0.35);
    }

    .slot-shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(20, 14, 10, 0.85) 0%,
        rgba(20, 14, 10, 0.15) 32%,
        rgba(20, 14, 10, 0) 50%,
        rgba(20, 14, 10, 0.15) 68%,
        rgba(20, 14, 10, 0.85) 100%
      );
      pointer-events: none;
      z-index: 4;
    }

    .slot-reel {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      will-change: transform;
    }

    .slot-item {
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 0 24px;
      border-bottom: 1px dashed rgba(229, 196, 123, 0.2);
      color: #faf6ee;
      font-family: 'Noto Serif KR', serif;
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 0.03em;
    }

    .slot-item .era-tag {
      font-size: 0.88rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(255, 255, 255, 0.12);
    }

    /* 붉은 인장 스타일 메인 버튼 */
    .btn-spin {
      background: linear-gradient(180deg, #b83232 0%, var(--seal-red) 100%);
      color: #faf6ee;
      border: 2px solid #f5c2c2;
      outline: 3px solid var(--seal-red);
      padding: 16px 48px;
      font-family: 'Noto Serif KR', serif;
      font-size: 1.35rem;
      font-weight: 900;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(163, 41, 41, 0.35);
      transition: transform 0.15s, background 0.2s;
      letter-spacing: 0.05em;
    }

    .btn-spin:hover:not(:disabled) {
      transform: translateY(-2px);
      background: linear-gradient(180deg, #c93b3b 0%, var(--seal-red-hover) 100%);
    }

    .btn-spin:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .spin-status-msg {
      margin-top: 16px;
      min-height: 28px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--seal-red);
    }

    /* ==================== 2. 퀴즈 출제 화면 (한지 두루마리) ==================== */
    .quiz-card {
      width: 100%;
      background: var(--hanji-card);
      border: 8px solid var(--wood-dark);
      outline: 2px solid var(--brass-gold);
      outline-offset: -12px;
      border-radius: 6px;
      padding: 36px 40px;
      box-shadow: 0 18px 40px rgba(34, 27, 22, 0.18);
      position: relative;
    }

    .quiz-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 18px;
      margin-bottom: 26px;
      border-bottom: 2px solid #d8cbb8;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-era {
      background: var(--wood-dark);
      color: var(--brass-light);
      border: 1.5px solid var(--brass-gold);
      font-size: 0.98rem;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 3px;
    }

    .badge-num {
      background: #efe6d5;
      color: var(--wood-dark);
      border: 1px solid var(--wood-light);
      font-size: 0.92rem;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 3px;
    }

    .quiz-prompt-label {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--seal-red);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .quiz-question-box {
      background: #f5efe4;
      border-left: 5px solid var(--wood-mid);
      border-right: 5px solid var(--wood-mid);
      padding: 28px 28px;
      margin-bottom: 26px;
      font-family: 'Noto Serif KR', serif;
      font-size: 1.75rem;
      font-weight: 700;
      line-height: 1.65;
      color: var(--ink-black);
      word-break: keep-all;
    }

    /* 초성 힌트 영역 */
    .hint-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: #efe6d5;
      border: 1.5px dashed var(--wood-light);
      border-radius: 4px;
      padding: 14px 20px;
      margin-bottom: 30px;
    }

    .hint-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--wood-dark);
      letter-spacing: 0.08em;
    }

    .btn-hint {
      background: var(--hanji-card);
      color: var(--wood-dark);
      border: 1.5px solid var(--wood-mid);
      padding: 8px 18px;
      border-radius: 3px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-hint:hover {
      background: var(--wood-mid);
      color: var(--brass-light);
    }

    .quiz-actions {
      display: flex;
      justify-content: flex-end;
      gap: 14px;
    }

    .btn-back {
      background: #e6dcc8;
      color: var(--wood-dark);
      border: 1.5px solid var(--wood-light);
      padding: 14px 24px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-next {
      background: linear-gradient(180deg, #b83232 0%, var(--seal-red) 100%);
      color: #faf6ee;
      border: 2px solid #f5c2c2;
      padding: 14px 36px;
      border-radius: 4px;
      font-family: 'Noto Serif KR', serif;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(163, 41, 41, 0.28);
      transition: transform 0.15s;
    }

    .btn-next:hover {
      transform: translateY(-2px);
    }

    /* ==================== 3. 정답 팝업 모달 (족자 & 인물 초상화) ==================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(24, 18, 14, 0.78);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      animation: fadeIn 0.25s ease-out;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .answer-modal {
      width: 100%;
      max-width: 820px;
      background: var(--hanji-card);
      border: 8px solid var(--wood-dark);
      outline: 2px solid var(--brass-gold);
      outline-offset: -12px;
      border-radius: 6px;
      padding: 34px 36px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      position: relative;
      animation: popScale 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popScale {
      from { opacity: 0; transform: scale(0.93); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 28px;
      align-items: center;
    }

    @media (max-width: 680px) {
      .modal-grid {
        grid-template-columns: 1fr;
        text-align: center;
      }
    }

    /* 인물 초상화 족자 프레임 */
    .portrait-box {
      width: 240px;
      height: 300px;
      margin: 0 auto;
      background: #efe6d5;
      border: 5px solid var(--wood-mid);
      outline: 2px solid var(--brass-gold);
      outline-offset: -6px;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(34, 27, 22, 0.2);
    }

    .portrait-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 사진이 없을 때 표시되는 전통 초상 그래픽 카드 */
    .portrait-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      text-align: center;
      background: radial-gradient(circle at center, #faf6ee 0%, #e4d7c1 100%);
      color: var(--wood-dark);
    }

    .fallback-seal {
      width: 64px;
      height: 64px;
      border: 3px solid var(--seal-red);
      color: var(--seal-red);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Serif KR', serif;
      font-size: 1.7rem;
      font-weight: 900;
      margin-bottom: 14px;
      background: rgba(163, 41, 41, 0.06);
    }

    .fallback-name {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.5rem;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .fallback-era {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--wood-light);
    }

    .portrait-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(34, 27, 22, 0.82);
      color: var(--brass-light);
      font-size: 0.78rem;
      padding: 4px 8px;
      text-align: center;
    }

    /* 정답 텍스트 영역 */
    .answer-details {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .answer-tag-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .answer-label {
      background: var(--seal-red);
      color: #faf6ee;
      font-size: 0.88rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 3px;
    }

    .answer-sub-era {
      background: var(--wood-dark);
      color: var(--brass-light);
      font-size: 0.88rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 3px;
    }

    .answer-person-name {
      font-family: 'Noto Serif KR', serif;
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--ink-black);
      letter-spacing: 0.04em;
      border-bottom: 2px solid #d8cbb8;
      padding-bottom: 10px;
    }

    .answer-achievement-box {
      background: #f5efe4;
      border: 1.5px solid #d6c7b0;
      border-radius: 4px;
      padding: 16px 18px;
      font-size: 1.15rem;
      line-height: 1.65;
      color: var(--ink-black);
      word-break: keep-all;
    }

    .answer-achievement-box strong {
      color: var(--seal-red);
      display: block;
      font-size: 0.92rem;
      margin-bottom: 4px;
    }

    .modal-footer {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
    }

    .btn-close-modal {
      background: var(--wood-dark);
      color: var(--brass-light);
      border: 2px solid var(--brass-gold);
      padding: 13px 32px;
      border-radius: 4px;
      font-family: 'Noto Serif KR', serif;
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-close-modal:hover {
      background: var(--seal-red);
      border-color: #f5c2c2;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- 상단 기와 처마 헤더 -->
  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="brand-seal">史</div>
        <div class="brand-title">

    // ==================== 한글 초성 추출 유틸리티 ====================
    function getInitialConsonants(str) {
      const CHOSUNG = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
      let result = "";
      for (let i = 0; i < str.length; i++) {
        const code = str.charCodeAt(i) - 0xAC00;
        if (code >= 0 && code <= 11171) {
          const choIdx = Math.floor(code / 588);
          result += CHOSUNG[choIdx];
        } else {
          result += str[i];
        }
      }
      return result;
    }

    // ==================== 위키백과 초상화·사진 자동 조회 ====================
    async function fetchPersonImage(wikiTitle) {
      if (imageCache.has(wikiTitle)) {
        return imageCache.get(wikiTitle);
      }
      try {
        const url = `https://ko.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(wikiTitle)}&prop=pageimages&format=json&pithumbsize=500&origin=*`;
        const res = await fetch(url);
        const data = await res.json();
        const pages = data.query.pages;
        const pageId = Object.keys(pages)[0];
        if (pageId !== "-1" && pages[pageId].thumbnail && pages[pageId].thumbnail.source) {
          const imgUrl = pages[pageId].thumbnail.source;
          imageCache.set(wikiTitle, imgUrl);
          return imgUrl;
        }
      } catch (e) {
        console.warn("이미지 로딩 실패, 기본 초상 카드로 대체:", wikiTitle);
      }
      imageCache.set(wikiTitle, null);
      return null;
    }

    // ==================== 남은 문제 계산 & 상단 현황판 갱신 ====================
    function getRemainingByEra(eraId) {
      return PEOPLE_DATA.filter(p => p.eraId === eraId && !completedIds.has(p.no));
    }

    function updateStatusUI() {
      const totalLeft = PEOPLE_DATA.length - completedIds.size;
      totalRemainingBadge.textContent = `남은 인물: ${totalLeft} / ${PEOPLE_DATA.length}명`;

      eraStatusBar.innerHTML = "";
      ERAS.forEach((era, idx) => {
        const left = getRemainingByEra(era.id).length;
        const pill = document.createElement("div");
        pill.className = "era-pill" + (left === 0 ? " empty" : "");
        pill.innerHTML = `<span>${idx + 1}. ${era.short}</span><span class="count">${left}</span>`;
        eraStatusBar.appendChild(pill);
      });

      if (totalLeft === 0) {
        btnSpin.disabled = true;
        btnSpin.textContent = "100인 퀴즈 완료!";
        spinStatusMsg.textContent = "🎉 모든 시대 100명의 인물을 전부 정복하셨습니다! 상단의 '처음부터 다시'를 눌러 초기화할 수 있습니다.";
      } else {
        btnSpin.disabled = false;
        btnSpin.textContent = "돌림판 돌리기";
      }
    }

    // ==================== 슬롯 릴 구성 ====================
    function buildSlotReel() {
      slotReel.innerHTML = "";
      reelItems = [];
      // 8개 시대를 여러 바퀴 반복 배치해 부드러운 무한 회전 연출
      const repeats = 14;
      for (let r = 0; r < repeats; r++) {
        ERAS.forEach((era, idx) => {
          reelItems.push(era);
          const itemDiv = document.createElement("div");
          itemDiv.className = "slot-item";
          itemDiv.innerHTML = `
            <span class="era-tag">제 ${idx + 1} 시대</span>
            <span>${era.name}</span>
          `;
          slotReel.appendChild(itemDiv);
        });
      }
      // 초기 중앙 위치 정렬 (1번째 인덱스 시대가 중앙 90px 칸에 오도록)
      slotReel.style.transition = "none";
      slotReel.style.transform = `translateY(0px)`;
    }

    // ==================== 돌림판 회전 & 시대 추첨 ====================
    function spinSlotMachine() {
      if (isSpinning) return;

      const availableEras = ERAS.filter(era => getRemainingByEra(era.id).length > 0);
      if (availableEras.length === 0) return;

      isSpinning = true;
      btnSpin.disabled = true;
      spinStatusMsg.textContent = "시대를 추첨하고 있습니다...";

      // 남은 문제가 있는 시대 중 하나를 랜덤 선택
      const chosenEra = availableEras[Math.floor(Math.random() * availableEras.length)];
      const eraIndex = ERAS.findIndex(e => e.id === chosenEra.id);

      // 릴의 뒤쪽 바퀴(예: 10번째 바퀴)에서 해당 시대가 중앙(슬롯 창 두 번째 줄, y=90px)에 멈추도록 계산
      const targetCycle = 10;
      const targetItemIndex = targetCycle * ERAS.length + eraIndex;
      // 슬롯 창 높이가 270px(3칸)이므로, targetItemIndex가 가운데 칸(top: 90px)에 오려면:
      const targetTranslateY = -(targetItemIndex * ITEM_HEIGHT - ITEM_HEIGHT);

      // 리셋 후 애니메이션 시작
      slotReel.style.transition = "none";
      slotReel.style.transform = `translateY(-${eraIndex * ITEM_HEIGHT}px)`;
      void slotReel.offsetWidth; // 강제 리플로우

      slotReel.style.transition = "transform 3.2s cubic-bezier(0.12, 0.85, 0.18, 1)";
      slotReel.style.transform = `translateY(${targetTranslateY}px)`;

      setTimeout(() => {
        spinStatusMsg.textContent = `✨ 당첨 시대: [ ${chosenEra.name} ] — 문제를 불러옵니다!`;
        setTimeout(() => {
          isSpinning = false;
          openQuizForEra(chosenEra);
        }, 850);
      }, 3250);
    }

    // ==================== 선택된 시대의 랜덤 인물 퀴즈 열기 ====================
    function openQuizForEra(era) {
      const candidates = getRemainingByEra(era.id);
      if (candidates.length === 0) return;

      currentPerson = candidates[Math.floor(Math.random() * candidates.length)];

      // 이미지 미리 백그라운드 로딩 시작
      fetchPersonImage(currentPerson.wiki);

      quizEraBadge.textContent = `시대: ${era.name}`;
      quizNumBadge.textContent = `인물 번호 #${currentPerson.no}`;
      quizRemainInEraBadge.textContent = `이 시대 남은 인물: ${candidates.length}명`;
      quizQuestionText.textContent = `“ ${currentPerson.desc} ”`;

      hintDisplay.textContent = "초성 힌트: (버튼을 누르면 초성이 공개됩니다)";
      btnShowHint.disabled = false;
      btnShowHint.textContent = "초성 힌트 보기";

      screenSlot.classList.remove("active");
      screenQuiz.classList.add("active");
    }

    // ==================== 초성 힌트 표시 ====================

      renderFallbackPortrait(currentPerson);

      const imgUrl = await fetchPersonImage(currentPerson.wiki);
      if (imgUrl && currentPerson) {
        portraitContainer.innerHTML = `
          <img src="${imgUrl}" alt="${currentPerson.name} 초상화" onerror="this.parentElement.innerHTML = getFallbackHTML('${currentPerson.name}', '${currentPerson.subEra}')" />

    });

    function getFallbackHTML(name, subEra) {
      const firstChar = name.charAt(0);
      return `
        <div class="portrait-fallback">
          <div class="fallback-seal">${firstChar}</div>
          <div class="fallback-name">${name}</div>
          <div class="fallback-era">${subEra}</div>
        </div>
      `;
    }

    function renderFallbackPortrait(person) {
      portraitContainer.innerHTML = getFallbackHTML(person.name, person.subEra);
    }

    // ==================== 팝업 닫기 -> 완료 처리 후 돌림판 복귀 ====================
    btnCloseModal.addEventListener("click", () => {
      if (currentPerson) {
        completedIds.add(currentPerson.no);
        currentPerson = null;
      }
      answerModalBackdrop.classList.remove("open");
      screenQuiz.classList.remove("active");
      screenSlot.classList.add("active");
      spinStatusMsg.textContent = "";
      updateStatusUI();
    });

    // 돌림판으로 그냥 돌아가기 (문제 소진 안 함)
    btnBackToSlot.addEventListener("click", () => {
      currentPerson = null;
      screenQuiz.classList.remove("active");
      screenSlot.classList.add("active");
      spinStatusMsg.textContent = "";
      updateStatusUI();
    });

    // 전체 초기화
    btnResetAll.addEventListener("click", () => {
      if (confirm("지금까지 푼 기록을 모두 초기화하고 100명 전체를 다시 시작할까요?")) {
        completedIds.clear();
        currentPerson = null;
        answerModalBackdrop.classList.remove("open");
        screenQuiz.classList.remove("active");
        screenSlot.classList.add("active");
        spinStatusMsg.textContent = "";
        updateStatusUI();
      }
    });

    btnSpin.addEventListener("click", spinSlotMachine);

    // 초기 실행
    buildSlotReel();
    updateStatusUI();
  </script>
</body>
</html>
